<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 492" role="img">
  <title>Architecture: Breaker connected (ON)</title>
  <desc>A customer or attacker submits a ticket to the service company's helpdesk app, which reads and writes tickets in the company database. The company's AI agent sends its SQL requests to the Breaker service, which runs only the allowed SQL on the company database and records stamps in the Breaker's own database. The Breaker does not own or copy the company database. Diagram by the Victim_Web project, translated to English.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text{font-family:-apple-system,"Segoe UI","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;}
    .t{font-size:14px;font-weight:600;}
    .ts{font-size:11.5px;}
    .lbl{font-size:12px;}
    .n{font-size:10px;font-weight:600;}
    .title{font-size:16px;font-weight:600;}
  </style>

  <rect x="0" y="0" width="680" height="492" fill="#ffffff"/>
  <text x="30" y="26" class="title" fill="#2C2C2A">Architecture: Breaker connected (ON)</text>

  <!-- zones -->
  <rect x="22" y="120" width="218" height="216" rx="12" fill="none" stroke="#378ADD" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="32" y="138" class="lbl" fill="#185FA5">Service company</text>
  <rect x="444" y="180" width="212" height="216" rx="12" fill="none" stroke="#7F77DD" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="454" y="198" class="lbl" fill="#534AB7">Trifecta Breaker</text>

  <!-- legend -->
  <rect x="470" y="46" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#378ADD"/>
  <text x="490" y="57" class="ts" fill="#2C2C2A">Owned by the service company</text>
  <rect x="470" y="70" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="490" y="81" class="ts" fill="#2C2C2A">Owned by Trifecta Breaker</text>
  <rect x="470" y="94" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#888780"/>
  <text x="490" y="105" class="ts" fill="#2C2C2A">External user</text>

  <!-- arrows -->
  <path d="M170,88 L170,148" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M205,216 L304,398" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M220,290 L458,347.5" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M490,376 L490,429 L453,429" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M490,320 L490,260" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- arrow labels -->
  <circle cx="186" cy="106" r="8" fill="#5F5E5A"/>
  <text x="186" y="109.5" class="n" fill="#ffffff" text-anchor="middle">1</text>
  <text x="199" y="110" class="lbl" fill="#5F5E5A">Ticket submitted</text>

  <circle cx="96" cy="370" r="8" fill="#5F5E5A"/>
  <text x="96" y="373.5" class="n" fill="#ffffff" text-anchor="middle">2</text>
  <text x="109" y="374" class="lbl" fill="#5F5E5A">Tickets read and written</text>

  <circle cx="266" cy="286" r="8" fill="#5F5E5A"/>
  <text x="266" y="289.5" class="n" fill="#ffffff" text-anchor="middle">3</text>
  <text x="279" y="290" class="lbl" fill="#5F5E5A">SQL request (/execute)</text>

  <circle cx="508" cy="412" r="8" fill="#5F5E5A"/>
  <text x="508" y="415.5" class="n" fill="#ffffff" text-anchor="middle">4</text>
  <text x="521" y="416" class="lbl" fill="#5F5E5A">Only allowed SQL runs</text>

  <circle cx="508" cy="290" r="8" fill="#5F5E5A"/>
  <text x="508" y="293.5" class="n" fill="#ffffff" text-anchor="middle">5</text>
  <text x="521" y="294" class="lbl" fill="#5F5E5A">Stamps recorded</text>

  <!-- Customer -->
  <rect x="40" y="40" width="170" height="48" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="125" y="64" class="t" fill="#2C2C2A" text-anchor="middle">Customer / attacker</text>
  <text x="125" y="81" class="ts" fill="#5F5E5A" text-anchor="middle">External user</text>

  <!-- Helpdesk app -->
  <rect x="40" y="150" width="180" height="66" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
  <text x="130" y="176" class="t" fill="#0C447C" text-anchor="middle">Helpdesk app</text>
  <text x="130" y="193" class="ts" fill="#185FA5" text-anchor="middle">Next.js: ticket form</text>
  <text x="130" y="207" class="ts" fill="#185FA5" text-anchor="middle">and ticket page</text>

  <!-- AI agent -->
  <rect x="40" y="262" width="180" height="56" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
  <text x="130" y="290" class="t" fill="#0C447C" text-anchor="middle">AI agent</text>
  <text x="130" y="307" class="ts" fill="#185FA5" text-anchor="middle">execute_sql tool</text>

  <!-- Breaker DB -->
  <rect x="460" y="205" width="185" height="52" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text x="552" y="231" class="t" fill="#3C3489" text-anchor="middle">Breaker DB</text>
  <text x="552" y="248" class="ts" fill="#534AB7" text-anchor="middle">Sessions and decision log</text>

  <!-- Breaker service -->
  <rect x="460" y="320" width="185" height="56" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text x="552" y="348" class="t" fill="#3C3489" text-anchor="middle">Breaker service</text>
  <text x="552" y="365" class="ts" fill="#534AB7" text-anchor="middle">Vercel: checkpoint (proxy)</text>

  <!-- Company DB -->
  <rect x="250" y="400" width="200" height="58" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
  <text x="350" y="429" class="t" fill="#0C447C" text-anchor="middle">Company DB</text>
  <text x="350" y="446" class="ts" fill="#185FA5" text-anchor="middle">Supabase, owned by the company</text>

  <text x="350" y="478" class="ts" fill="#5F5E5A" text-anchor="middle">The Breaker does not own or copy this database. It only connects to it.</text>
</svg>
